<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SVG Local Viewer</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }

        #viewer-container {
            margin: 20px auto;
            max-width: 800px;
            position: relative; /* Needed for absolute positioning of overlay */
        }

        svg, object {
            border: 1px dashed black;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
        }


        td {
            padding: 5px;
            border: 1px solid black;
        }
        .true {
            background-color: aquamarine;
        }

        .false {
            background-color: pink;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #file-name {
            margin-bottom: 10px;
            color: #666;
        }
    </style>
</head>

<body >

    <h1>Local SVG Navigator</h1>
    <div id="file-name">Current: file-001.svg</div>

    <div class="controls">
        <button onclick="changeImage(-1)">❮ Previous</button>
        <button onclick="changeImage(1)">Next ❯</button>
    </div>
    <div style="margin-top: 10px;">
        <Label>
            Verse:
            <input type="number" step="1" name="verse" id="verse" style="padding: 5px;"
                onchange="onVerseChange(this.value)">
        </Label>
        <br />
        <Label>
            Focus mode:
            <input type="checkbox" name="focus" id="focus" style="padding: 5px;"
                onchange="changeImage(0,  document.getElementById('verse').value, document.getElementById('deviceType').value, document.getElementById('focus').checked)">
        </Label>
        <br />
        <Label>
            Gregorian Mode:
            <input type="checkbox" name="gregorian" id="gregorian" style="padding: 5px;"
                onchange="changeImage(0, document.getElementById('verse').value, document.getElementById('deviceType').value, this.checked)">
        </Label>
        <br />
        <!-- add gregorian checkbox input, and add  `/kidung-jemaat/render/${currentIndex}?gregroian={gregorian}` to the URL -->
        <Label>
            Device Type:
            <select id="deviceType" onchange="changeImage(0, document.getElementById('verse').value, this.value, document.getElementById('gregorian').checked)" style="padding: 5px;">
                <option value="" selected>Select Device Type</option> 
                <option value="0">One Continous Line</option> 
                <option value="1">iPhone 16</option>
                <option value="2">iPhone 16 Plus</option>
                <option value="3">iPhone 16 Pro</option>
                <option value="4">iPhone 16 Pro Max</option>
                <option value="5">Pixel 7</option>
                <option value="6">Pixel 8</option>
                <option value="7">Pixel 8 Pro</option>
                <option value="8">Pixel 8a</option>
                <option value="9">Pixel 9</option>
                <option value="10">Pixel 9 Pro</option>
                <option value="11">Pixel 9 Pro XL</option>
                <option value="12">Pixel 10</option>
                <option value="13">Samsung Galaxy A55</option>
                <option value="14">Samsung Galaxy S8+</option>
                <option value="15">Samsung Galaxy S20 Ultra</option>
                <option value="16">Samsung Galaxy A51/71</option>
                <option value="17">Facebook on Android</option>
                <option value="18">Surface Duo</option>
                <option value="19">Pixel 9 Pro Fold</option>
                <option value="20">Galaxy Z Fold 5</option>
                <option value="21">Galaxy Z Fold 6</option>
                <option value="22">Asus Zenbook Fold</option>
                <option value="23">iPad Mini</option>
                <option value="24">iPad Pro 13</option>
                <option value="25">Surface Pro 10</option>
                <option value="26">Surface Pro 7</option>
                <option value="27">Nest Hub Max</option>
            </select>
        </Label>
        <table align="center">
            <tr id="indicator"></tr>
        </table>
    </div >
    <div id="viewer-container" style="background-color: white;border:1px dashed red">
        <!-- The img tag handles local SVG files effectively -->
        <!-- <img  src="/kidung-jemaat/render/1" alt="SVG Image"> -->
        <object id="svg-display" type="image/svg+xml" data="/kidung-jemaat/render/1"></object>
    </div >


    <script>
        let currentIndex = 1;


        function onVerseChange(val) {
            changeImage(0, val, document.getElementById('deviceType').value, document.getElementById('gregorian').checked)
        }

        // Function to handle image changes
        function changeImage(step, verse, deviceType, gregorian) {
            currentIndex += step;
            if (currentIndex < 1) currentIndex = 1;

            let params = new Array();

            const paddedIndex = String(currentIndex).padStart(3, '0');
            var newFileName = `/kidung-jemaat/render/${currentIndex}`;
            if (verse) {
                params.push(`verse=` + verse)
            }
            if (deviceType) {
                params.push(`device_type=${deviceType}`)
            }
            if (gregorian) {
                params.push(`gregorian=true`);
            } else {
                params.push(`gregorian=false`);
            }


            const focusElmnt = document.getElementById('focus')

            if (focusElmnt.checked) {
                params.push(`focus=` + focusElmnt.checked)
            }

            newFileName += "?" + params.join("&")

            const imgElement = document.getElementById('svg-display');
            const nameDisplay = document.getElementById('file-name');

            imgElement.data = newFileName;
            nameDisplay.textContent = `Current: ${newFileName}`;

            imgElement.onerror = function () {
                nameDisplay.textContent = `Error: ${newFileName} not found.`;
                imgElement.alt = "File not found";
            };

            const viewerContainer = document.getElementById('viewer-container');
            viewerContainer.innerHTML = ''; // Clear previous content/overlay

            const deviceTypeMap = {
                0: { PortraitW: 0, PortraitH: 0 },
                1: { PortraitW: 393, PortraitH: 852 },
                2: { PortraitW: 430, PortraitH: 932 },
                3: { PortraitW: 402, PortraitH: 874 },
                4: { PortraitW: 440, PortraitH: 956 },
                5: { PortraitW: 412, PortraitH: 892 },
                6: { PortraitW: 412, PortraitH: 892 },
                7: { PortraitW: 448, PortraitH: 968 },
                8: { PortraitW: 393, PortraitH: 852 },
                9: { PortraitW: 412, PortraitH: 915 },
                10: { PortraitW: 412, PortraitH: 915 },
                11: { PortraitW: 448, PortraitH: 968 },
                12: { PortraitW: 412, PortraitH: 915 },
                13: { PortraitW: 384, PortraitH: 832 },
                14: { PortraitW: 360, PortraitH: 740 },
                15: { PortraitW: 412, PortraitH: 915 },
                16: { PortraitW: 412, PortraitH: 915 },
                17: { PortraitW: 360, PortraitH: 640 },
                18: { PortraitW: 540, PortraitH: 720 },
                19: { PortraitW: 992, PortraitH: 862 },
                20: { PortraitW: 768, PortraitH: 952 },
                21: { PortraitW: 968, PortraitH: 848 },
                22: { PortraitW: 1280, PortraitH: 1710 },
                23: { PortraitW: 744, PortraitH: 1133 },
                24: { PortraitW: 1032, PortraitH: 1376 },
                25: { PortraitW: 912, PortraitH: 1368 },
                26: { PortraitW: 912, PortraitH: 1368 },
                27: { PortraitW: 1280, PortraitH: 800 },
            };

            if (deviceType && deviceTypeMap[deviceType]) {
                const dims = deviceTypeMap[deviceType];
                
                // Create and append SVG object first
                const svgObject = document.createElement('object');
                svgObject.id = 'svg-display';
                svgObject.type = 'image/svg+xml';
                svgObject.setAttribute('data', newFileName);
                viewerContainer.appendChild(svgObject);

                const overlay = document.createElement('div');
                overlay.style.position = 'absolute';
                overlay.style.top = '0';
                overlay.style.left = '0';
                overlay.style.width = `${dims.PortraitW}px`;
                overlay.style.height = `${dims.PortraitH}px`;
                overlay.style.border = '2px dashed blue';
                overlay.style.pointerEvents = 'auto'; // Allow interaction for dragging
                overlay.style.zIndex = '10';
                overlay.innerHTML = `<div style="position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.7); color: white; padding: 5px; font-size: 12px;">Portrait: ${dims.PortraitW}x${dims.PortraitH}</div><div id="drag-handle" style="position: absolute; bottom: 0; right: 0; width: 15px; height: 15px; cursor: se-resize; background: rgba(0,0,0,0.5); border: 1px solid white;"></div>`;
                viewerContainer.appendChild(overlay); 

                // Function to make the overlay draggable
                function makeDraggable(element) {
                    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

                    const dragMouseDown = (e) => {
                        e = e || window.event;
                        e.preventDefault();
                        pos3 = e.clientX;
                        pos4 = e.clientY;
                        document.onmouseup = closeDragElement;
                        document.onmousemove = elementDrag;
                    };

                    const elementDrag = (e) => {
                        e = e || window.event;
                        e.preventDefault();
                        pos1 = pos3 - e.clientX;
                        pos2 = pos4 - e.clientY;
                        pos3 = e.clientX;
                        pos4 = e.clientY;
                        element.style.top = (element.offsetTop - pos2) + "px";
                        element.style.left = (element.offsetLeft - pos1) + "px";
                    };

                    const closeDragElement = () => {
                        document.onmouseup = null;
                        document.onmousemove = null;
                    };

                    const handle = element.querySelector('#drag-handle');
                    if (handle) {
                        handle.onmousedown = dragMouseDown;
                    }
                }
                makeDraggable(overlay);
            } else {
                // If no deviceType or invalid, just display the SVG
                const svgObject = document.createElement('object');
                svgObject.id = 'svg-display';
                svgObject.type = 'image/svg+xml';
                svgObject.setAttribute('data', newFileName);
                viewerContainer.appendChild(svgObject);
            }
            
            var eventStream = newFileName.replace('kidung-jemaat/render/', 'internal/diagnostic/verse/')
            console.log(eventStream)
            const eventSource = new EventSource(eventStream);
             document.getElementById("indicator").innerHTML = "";
            eventSource.addEventListener('data', (event) => {
                // 1. Parse incoming channel data
                console.log("Data received:", event.data);

                var ind = JSON.parse(event.data);

                var element = new Array();
                // element.forEach()
                for (const [key, value] of Object.entries(ind)) {
                    element.push("<td class='" + value + "''><h3>" + key + " </h3></td>")
                }

                var inner = element.join("");
                document.getElementById("indicator").innerHTML = inner;




            });

            eventSource.addEventListener('close', (event) => {
                console.log("Server signaled end of stream. Data:", event.data);

                // Explicitly disconnect to prevent auto-reconnection
                eventSource.close();
            });

        }

        // Keyboard Listener for Arrow Keys
        document.addEventListener('keydown', (event) => {
            const verseInput = document.getElementById('verse');
            if (event.key === 'ArrowLeft') {
                verseInput.value = 1
                changeImage(-1, verseInput.value, document.getElementById('deviceType').value, document.getElementById('gregorian').checked);
            } else if (event.key === 'ArrowRight') {
                changeImage(1, verseInput.value, document.getElementById('deviceType').value, document.getElementById('gregorian').checked);
                verseInput.value = 1
            } else if (event.key === 'ArrowUp') {
                verseInput.value++
                changeImage(0, verseInput.value, document.getElementById('deviceType').value, document.getElementById('gregorian').checked);
            } else if (event.key === 'ArrowDown') {
                verseInput.value--
                changeImage(0, verseInput.value, document.getElementById('deviceType').value, document.getElementById('gregorian').checked);
            }
        });
    </script>
</body >

</html >
